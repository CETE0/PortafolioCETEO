name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_CLOUDINARY_CLOUD_NAME: ${{ vars.VITE_CLOUDINARY_CLOUD_NAME }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:anim
      - name: Smoke test the built Worker
        run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 60); do curl -sf -o /dev/null http://localhost:4173 && break; sleep 1; done
          npm run smoke -- http://localhost:4173
